<!-- pages/biodiversity/module/templates/bio_popup.html -->
<style>
  /* —— Scoped to .bio-popup-v2 —— */
  .bio-popup-v2{
    width:min(340px, 82vw);
    background:#fff;
    border:1px solid #e9eff2;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
    overflow:hidden;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    color:#24323a;
  }
  .bpv2-header{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px;
    background:linear-gradient(135deg,#00695c,#26a69a);
    color:#fff;
  }
  .bpv2-icon{
    flex:0 0 auto;
    width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.18);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
    font-size:18px;
  }
  .bpv2-title{font-weight:800;font-size:16px;line-height:1.15;margin:0}
  .bpv2-subtitle{opacity:.9;font-size:12px;margin-top:2px}
  .bpv2-chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 0;}
  .bpv2-chip{display:inline-block;padding:6px 10px;background:#f0f7f6;border:1px solid #cfe6e2;color:#0f4d4a;border-radius:999px;font-size:12px;line-height:1;}
  .bpv2-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:12px 14px 14px;}
  .bpv2-kv span{display:block;font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:#6c7a83;margin-bottom:3px;}
  .bpv2-kv b{font-weight:700;font-size:13px;color:#1f2a30;word-break:break-word}
  .bpv2-kv.kv-2{grid-column:1 / span 2}
  .bpv2-footer{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid #eef2f4;font-size:12px;color:#486068}
  .bpv2-dot{width:6px;height:6px;border-radius:50%;background:#26a69a;flex:0 0 auto}
</style>

<div class="bio-popup-v2">
  <!-- Header -->
  <div class="bpv2-header">
    <div class="bpv2-icon">🌿</div>
    <div>
      <div class="bpv2-title">{{display_name}}</div>
      <div class="bpv2-subtitle">{{species}}</div>
    </div>
  </div>

  <!-- Quick chips -->
  <div class="bpv2-chips">
    <span class="bpv2-chip">{{taxa}}</span>
    <span class="bpv2-chip">{{kingdom}}</span>
  </div>

  <!-- Key/Values -->
  <div class="bpv2-grid">
    <div class="bpv2-kv kv-2"><span>Common name</span><b>{{commonname}}</b></div>
    <div class="bpv2-kv"><span>Phylum</span><b>{{phylum}}</b></div>
    <div class="bpv2-kv"><span>Class</span><b>{{class_}}</b></div>
    <div class="bpv2-kv"><span>Order</span><b>{{order_}}</b></div>
    <div class="bpv2-kv"><span>Family</span><b>{{family}}</b></div>
    <div class="bpv2-kv"><span>Genus</span><b>{{genus}}</b></div>
    <div class="bpv2-kv"><span>Species</span><b>{{species}}</b></div>
    <div class="bpv2-kv"><span>Sighting date</span><b>{{sighting}}</b></div>
    <div class="bpv2-kv"><span>Source</span><b>{{datares}}</b></div>
    <div class="bpv2-kv kv-2"><span>Identification notes</span><b>{{notes}}</b></div>
    <!-- 如需位置或经纬度，可再开启下两行 -->
    <!-- <div class="bpv2-kv kv-2"><span>Location</span><b>{{location}}</b></div> -->
    <!-- <div class="bpv2-kv"><span>Lat</span><b>{{lat}}</b></div><div class="bpv2-kv"><span>Lon</span><b>{{lon}}</b></div> -->
  </div>

  <!-- Footer -->
  <div class="bpv2-footer">
    <div class="bpv2-dot"></div>
    <div>Taxa: <b>{{taxa}}</b></div>
  </div>
</div>
